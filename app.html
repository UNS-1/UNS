const t=k=>T[S.lang][k]||k,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s),fd=d=>d?new Date(d).toLocaleDateString(S.lang==='ar'?'ar-JO':'en-GB'):'';
S.theme=thLoad('sky');S.logged=new Set();S.aal=null;S.next=null;S.mf=null;
function setTh(k){S.theme=k;thSave(k);R()}
function renderTh(){thRender(S.theme,S.prof&&(S.prof.role==='nurse'||S.prof.role==='admin'),k=>t('th_'+k),'setTh')}
const am=e=>{const m=((e&&e.message)||'')+' '+((e&&e.code)||'');console.error(e);return /rate limit|over_email|too many/i.test(m)?t('rate'):/not confirmed|email_not_confirmed/i.test(m)?t('unconf'):/invalid login|invalid_credentials/i.test(m)?t('bad_login'):/already registered|user_already_exists/i.test(m)?t('dup'):/weak_password|password should/i.test(m)?t('short'):/signups? not allowed|signup_disabled/i.test(m)?t('nosign'):/failed to fetch|network/i.test(m)?t('offline'):/captcha/i.test(m)?t('capbad'):/only a caregiver|age group/i.test(m)?t('ag_err'):t('err')},em=am;
const CK=C.captchaSiteKey||'';let capTok='';
function capInit(){if(!CK)return;const b=$('#cap');if(!b||b.dataset.done)return;if(!window.turnstile){if(!document.getElementById('tsjs')){const sc=document.createElement('script');sc.id='tsjs';sc.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';sc.onload=capInit;document.head.appendChild(sc)}return}b.dataset.done=1;window.turnstile.render(b,{sitekey:CK,callback:x=>{capTok=x}})}
function capReset(){capTok='';try{window.turnstile&&window.turnstile.reset()}catch(e){}}
function logOpen(id){if(S.logged.has(id))return;S.logged.add(id);sb.rpc('log_access',{c:id,act:'OPEN_PROFILE'}).then(()=>{},()=>{})}
function L(){S.lang=S.lang==='ar'?'en':'ar';R()}
function R(){renderTh();document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';$('#lg').textContent=t('lang');$('#hm').textContent=t('home');$('#ft').textContent=t('foot');
 $('#so').hidden=!S.user;$('#so').textContent=t('so');
 $('#app').innerHTML=(S.msg?`<p class="card ok" role="status">${esc(S.msg)}</p>`:'')+(S.err?`<p class="card err" role="alert">${esc(S.err)}</p>`:'')+(!S.user?authV():!S.prof?'':({caregiver:careV,nurse:nurseV,admin:()=>S.aal==='aal2'?`<div class="card">${t('adm')}</div>`:mfaV(),child:()=>`<div class="card">${t('chd')}</div>`}[S.prof.role]||careV)());if(!S.user)capInit()}
function say(m,e){S.msg=m||'';S.err=e||'';R()}
function authV(){const up=S.mode==='up';return`<div class="card"><div class="row"><button class="${up?'':'on'}" onclick="S.mode='in';say()">${t('signin')}</button><button class="${up?'on':''}" onclick="S.mode='up';say()">${t('signup')}</button></div>
${up?`<label>${t('name')}<input id="nm" maxlength="60" autocomplete="name"></label>`:''}<label>${t('email')}<input id="em" type="email" dir="ltr" autocomplete="email"></label><label>${t('pw')}<input id="pw" type="password" autocomplete="${up?'new-password':'current-password'}"></label>${CK?'<div id="cap"></div>':''}
<button class="pri" onclick="${up?'signUp()':'signIn()'}">${up?t('mk'):t('go')}</button>${up?`<p><small>${t('note')}</small></p>`:''}</div>`}
async function signUp(){const n=$('#nm').value.trim(),e=$('#em').value.trim(),p=$('#pw').value;if(!n||!e||p.length<8)return say('',t('short'));
 const{data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{display_name:n},captchaToken:capTok||undefined}});capReset();if(error)return say('',am(error));
 if(data.session){S.user=data.user;await loadAll();say()}else{S.mode='in';say(t('chk'))}}
async function signIn(){const{data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value,options:{captchaToken:capTok||undefined}});capReset();
 if(error)return say('',am(error));S.user=data.user;S.nok=false;await loadAll();say()}
async function out(){await sb.auth.signOut();S.user=S.prof=null;S.nok=false;S.nc=null;S.kids=[];S.aal=null;S.mf=null;S.logged=new Set();say()}
async function loadAll(){try{const{data,error}=await sb.from('profiles').select('role,display_name,nurse_code').eq('id',S.user.id).single();if(error)throw error;S.prof=data;
 if(data.role==='nurse'||data.role==='admin')await aalInit();
 if(data.role==='nurse'&&S.aal!=='aal2'){S.kids=[];return}
 if(data.role==='caregiver'||data.role==='nurse'){const k=await sb.from('child_profiles').select('id,nickname,age_group').order('created_at');S.kids=k.data||[];S.kids.forEach(c=>logOpen(c.id));
  if(data.role==='caregiver'){S.cons={};for(const c of S.kids){const r=await sb.from('consent_records').select('consent_type,granted,recorded_at').eq('child_id',c.id).order('recorded_at',{ascending:false});S.cons[c.id]={};for(const x of r.data||[])if(!(x.consent_type in S.cons[c.id]))S.cons[c.id][x.consent_type]=x.granted;
   const n=await sb.rpc('child_nurses',{c:c.id});c.nurses=(n.data||[]).map(x=>x.display_name)}}
  else{const cd=await sb.from('family_codes').select('id,child_id,expires_at,used_at,created_at').order('created_at',{ascending:false}),rl=await sb.from('caregiver_relationships').select('id,child_id,status,verified_at');
   S.codes={};S.rels={};for(const x of cd.data||[])(S.codes[x.child_id]=S.codes[x.child_id]||[]).push(x);for(const x of rl.data||[])(S.rels[x.child_id]=S.rels[x.child_id]||[]).push(x)}}
 }catch(e){S.err=em(e)}}
// ---- caregiver
function careV(){return`<h2>${t('hi')}${esc(S.prof.display_name)} <small>(${t('role_'+S.prof.role)})</small></h2>
<div class="card"><b>${t('code')}</b><input id="fc" dir="ltr" maxlength="12" autocomplete="off" placeholder="${t('cph')}"><button class="pri" onclick="redeem()">${t('enter')}</button></div>
${S.kids.map(c=>`<div class="card"><h3>👧 ${t('mychild')}: ${esc(c.nickname)} <small>(${esc(c.age_group)})</small></h3><p>${t('nurseis')}: <b>${esc((c.nurses||[]).join('، ')||'—')}</b></p><h3>${t('ag_t')}</h3><div class="row">${['7-8','9-10','11-12'].map(b=>`<button class="${c.age_group===b?'on':''}" aria-pressed="${c.age_group===b}" onclick="setAge('${c.id}','${b}')">${b.replace('-','–')} · ${t('ag'+b.replace('-',''))}</button>`).join('')}</div>${(c.age_group==='5-7'||c.age_group==='8-10')?`<p class="card warn"><small>${t('ag_legacy')}</small></p>`:''}<p><button onclick="location.href='index.html#settings'">${t('ag_open')}</button></p><h3>${t('cons')}</h3>
${CT.map(k=>`<label style="display:flex;gap:10px;align-items:center"><input type="checkbox" style="width:28px;height:28px;margin:0" ${S.cons[c.id]?.[k]?'checked':''} onchange="setCons('${c.id}','${k}',this.checked)"> ${t('c_'+k)}</label>`).join('')}<p><small>${t('consn')}</small></p></div>`).join('')}`}
async function redeem(){const v=$('#fc').value.trim();if(!v)return;const{data,error}=await sb.rpc('redeem_family_code',{p:v});
 if(error)return say('',/too many/i.test(error.message)?t('lock'):em(error));if(!data)return say('',t('bad'));await loadAll();say(t('linked'))}
async function setCons(cid,k,g){const{error}=await sb.from('consent_records').insert({child_id:cid,consent_type:k,granted:g,granted_by:S.user.id});if(error)say('',em(error));else{S.cons[cid][k]=g}}
// ---- nurse
function nurseV(){if(S.aal!=='aal2')return mfaV();if(!S.nok)return`<div class="card"><h2>🩺 ${t('nogate')}</h2><input id="nc" dir="ltr" maxlength="8" autocomplete="off" placeholder="N____" aria-label="${t('ncode')}"><button class="pri" onclick="verify()">${t('verify')}</button></div>`;
return`<h2>${t('hi')}${esc(S.prof.display_name)} <small>(${t('role_nurse')})</small></h2><p class="card warn">${t('mycode')}: <b dir="ltr">${esc(S.prof.nurse_code)}</b></p>
<div class="card"><h3>${t('addc')}</h3><input id="kn" maxlength="30" placeholder="${t('nick')}" aria-label="${t('nick')}"><select id="kb" aria-label="${t('band')}"><option>7-8</option><option selected>9-10</option><option>11-12</option></select><button class="pri" onclick="addKid()">${t('add')}</button></div>
<h3>${t('kids')}</h3>${S.kids.length?S.kids.map(kidV).join(''):`<p>${t('nokids')}</p>`}`}
const cst=c=>c.used_at?t('used'):new Date(c.expires_at)<new Date()?t('exp'):t('active');
function kidV(c){const nc=S.nc&&S.nc.kid===c.id?S.nc.code:null;return`<div class="card"><h3>👧 ${esc(c.nickname)} <small>(${esc(c.age_group)})</small></h3><h3>${t('ag_t')}</h3><div class="row">${['7-8','9-10','11-12'].map(b=>`<button class="${c.age_group===b?'on':''}" aria-pressed="${c.age_group===b}" onclick="setAge('${c.id}','${b}')">${b.replace('-','–')} · ${t('ag'+b.replace('-',''))}</button>`).join('')}</div>${(c.age_group==='5-7'||c.age_group==='8-10')?`<p class="card warn"><small>${t('ag_legacy')}</small></p>`:''}<button class="pri" onclick="mkCode('${c.id}')">${t('mkcode')}</button>
${nc?`<p><b>${t('newc')}</b></p><div class="code">${esc(nc)}</div><button onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(nc)}').then(()=>say(t('copied')))">${t('copy')}</button>`:''}
${(S.codes[c.id]||[]).length?`<h3>${t('codes')}</h3>${S.codes[c.id].map(x=>`<div>🔑 ${cst(x)} <small>${fd(x.created_at)}</small></div>`).join('')}`:''}
${(S.rels[c.id]||[]).length?`<h3>${t('fam')}</h3>${S.rels[c.id].map(r=>`<div class="row">👪 ${t('st_'+r.status)} <small>${fd(r.verified_at)}</small>${r.status==='active'?`<button onclick="revoke('${r.id}')">${t('revoke')}</button>`:''}</div>`).join('')}`:''}</div>`}
async function verify(){const{data,error}=await sb.rpc('nurse_verify_code',{p:$('#nc').value.trim().toUpperCase()});if(error)return say('',/too many/i.test(error.message)?t('lock'):em(error));if(data){S.nok=true;say()}else say('',t('nbad'))}
async function addKid(){const n=$('#kn').value.trim();if(!n)return;const{error}=await sb.rpc('nurse_create_child',{nick:n,band:$('#kb').value});if(error)return say('',em(error));await loadAll();say()}
async function mkCode(id){const{data,error}=await sb.rpc('nurse_create_family_code',{c:id});if(error)return say('',em(error));S.nc={kid:id,code:data};await loadAll();say()}
async function revoke(id){const{error}=await sb.rpc('nurse_revoke_caregiver',{rel:id});if(error)return say('',em(error));await loadAll();say()}

async function aalInit(){try{const{data}=await sb.auth.mfa.getAuthenticatorAssuranceLevel();S.aal=data.currentLevel;S.next=data.nextLevel}catch(e){S.aal='aal1';S.next=null}}
function mfaV(){const m=S.mf,enrolled=S.next==='aal2';return`<div class="card"><h2>🔐 ${t('mfa_t')}</h2>${enrolled?`<p>${t('mfa_enter')}</p>`:m?`<p>${t('mfa_scan')}</p><img src="${m.qr}" alt="QR" width="180" height="180" style="background:#fff;border-radius:12px"><p dir="ltr"><code>${esc(m.secret)}</code></p>`:`<p>${t('mfa_need')}</p><button class="pri" onclick="enrollMfa()">${t('mfa_start')}</button>`}${enrolled||m?`<input id="mc" dir="ltr" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000" aria-label="${t('mfa_code')}"><button class="pri" onclick="verifyMfa()">${t('verify')}</button>`:''}</div>`}
async function setAge(id,b){const{error}=await sb.rpc('set_child_age_group',{c:id,band:b});if(error)return say('',am(error));await loadAll();say(t('ag_saved'))}
async function enrollMfa(){const{data,error}=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'UNS '+Date.now()});if(error)return say('',am(error));
 S.mf={id:data.id,qr:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(String(data.totp.qr_code).replace(/^data:image\/svg\+xml;utf8,/,'')),secret:data.totp.secret};say()}
async function verifyMfa(){let fid=S.mf&&S.mf.id;if(!fid){const f=await sb.auth.mfa.listFactors();fid=f.data&&f.data.totp&&f.data.totp[0]&&f.data.totp[0].id}if(!fid)return say('',t('err'));
 const{error}=await sb.auth.mfa.challengeAndVerify({factorId:fid,code:($('#mc').value||'').trim()});if(error)return say('',t('mfa_bad'));S.mf=null;await loadAll();say()}
