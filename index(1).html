[2,'🧑‍⚕️','من هو ممرضي؟','Who is my nurse?','الممرض شخص يهتم بك. يتابع كيف تشعر، ويساعدك في الدواء، ويستمع إليك. أخبره إن أقلقك شيء.','A nurse is a person who cares for you. They check how you feel, help with your medicine and listen to you. You can tell your nurse when something worries you.','متى أخبر ممرضي؟','When can I tell my nurse something?',['عندما يقلقني شيء','When something worries me'],['لا أخبره أبدًا','Never'],0],

[4,'💊','من يقرر دوائي؟','Who decides my medicine?','الدواء يساعد جسمك. الطبيب والممرض هما من يقرران أي دواء وكم مقداره. لا تأخذ أي دواء بمفردك أبدًا.','Medicine is given to help your body. Your doctor and nurse decide which one and how much. Never take medicine on your own.','من يقرر دوائي؟','Who decides my medicine?',['أنا وحدي','Only me'],['الطبيب والممرض','My doctor and nurse'],1],

const SP_P=[['🌙','القمر','the Moon'],['🔴','المريخ','Mars'],['🪐','زحل','Saturn'],['🌈','سديم قوس قزح','the Rainbow Nebula'],['🏰','قلعة النجوم','the Star Castle']],
 SP_NEED=25,SP_W=360,SP_H=540,SP_LX=[.2,.5,.8].map(x=>x*SP_W),SP_PY=SP_H-100,SP_BG=[['#1b2a5c','#4a5fa8'],['#4a1f2e','#c45a4a'],['#2a2350','#8a6bc4'],['#1d3a5c','#5ac8c4'],['#3a2260','#e07ab8']],
 SP_E={s:'⭐',g:'💎',a:'☄️',m:'🧲',h:'🛡️',b:'⚡',l:'💖',j:'🍮'};
function spNew(){const bg=[];for(let i=0;i<40;i++)bg.push({x:Math.random()*SP_W,y:Math.random()*SP_H,z:.3+Math.random()*.7});
 return{st:'ready',lane:1,x:SP_LX[1],t:0,p:0,got:0,tot:0,combo:0,items:[],parts:[],shield:0,magnet:0,boost:0,slow:0,shake:0,next:.5,msg:'',pause:0,sound:0,bg,flash:0,boss:null,stk:0}}
function spSpeed(g){return(230+g.p*28)*(g.boost>0?1.7:1)*(g.slow>0?.6:1)*(ST.rm?.75:1)}
function spSpawn(g){const L=[0,1,2],free=L.slice();
 if(g.boost<=0&&Math.random()<.4){const n=Math.random()<.35?2:1;for(let k=0;k<n;k++){const i=Math.floor(Math.random()*free.length),l=free.splice(i,1)[0];g.items.push({k:'a',l,x:SP_LX[l],y:-30})}}
 if(!free.length)return;const l=free[Math.floor(Math.random()*free.length)],r=Math.random();
 if(g.boost<=0&&r<.07)g.items.push({k:['m','h','b'][Math.floor(Math.random()*3)],l,x:SP_LX[l],y:-30});
 else if(r<.17)g.items.push({k:'g',l,x:SP_LX[l],y:-30});
 else for(let j=0;j<3;j++)g.items.push({k:'s',l,x:SP_LX[l],y:-30-j*46})}
function spBurst(g,x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=60+Math.random()*140;g.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.6,c})}}
function spGain(g,n){g.got=Math.min(SP_NEED,g.got+n);g.tot+=n;if(g.got>=SP_NEED&&!g.boss)spBossStart(g)}
function spStep(g,dt){g.t+=dt;const v=spSpeed(g);
 ['boost','slow','magnet','shake','flash'].forEach(k=>{if(g[k]>0)g[k]=Math.max(0,g[k]-dt)});
 g.x+=(SP_LX[g.lane]-g.x)*Math.min(1,dt*13);
 if(g.boss)spBossTick(g,dt);g.next-=dt;if(g.next<=0){if(g.boss){spHeart(g);g.next=.65}else{spSpawn(g);g.next=Math.max(.38,.75-g.p*.06)*(g.boost>0?.5:1)}}
 for(const it of g.items){it.y+=v*dt;
  if(g.magnet>0&&(it.k==='s'||it.k==='g'||it.k==='l')&&Math.abs(it.y-SP_PY)<170){it.x+=(g.x-it.x)*Math.min(1,dt*7)}}
 const keep=[];
 for(const it of g.items){const hit=Math.abs(it.y-SP_PY)<34&&Math.abs(it.x-g.x)<34;
  if(!hit){if(it.y<SP_H+60)keep.push(it);continue}
  if(it.k==='s'){g.combo++;spGain(g,1+(g.combo%6===0?1:0));spBurst(g,it.x,it.y,'#ffe066',8);spBeep(g,500+Math.min(g.combo,12)*40,.07);if(g.combo%6===0)g.msg=t('sp_combo')}
  else if(it.k==='g'){g.combo++;spGain(g,3);spBurst(g,it.x,it.y,'#7fe7ff',16);spBeep(g,880,.12);g.msg=t('sp_gem')}
  else if(it.k==='l'){const b=g.boss;if(b){b.got++;b.laugh=.5;g.combo++;spBurst(g,it.x,it.y,'#ff7ab8',12);spBeep(g,700+b.got*40,.1);if(b.got>=b.hp)spBossWin(g);else g.msg=t('sp_hit')}}
  else if(it.k==='m'){g.magnet=7;g.msg=t('sp_mag');spBurst(g,it.x,it.y,'#ff9ad5',12);spBeep(g,620,.15)}
  else if(it.k==='h'){g.shield=1;g.msg=t('sp_shd');spBurst(g,it.x,it.y,'#9ad0ff',12);spBeep(g,700,.15)}
  else if(it.k==='b'){g.boost=3.5;g.msg=t('sp_bst');spBurst(g,it.x,it.y,'#ffb347',20);spBeep(g,760,.2)}
  else if(it.k==='a'||it.k==='j'){if(g.boost>0){spBurst(g,it.x,it.y,'#ffd9a0',14);spBeep(g,300,.08)}
   else if(g.shield){g.shield=0;g.msg=t('sp_pop');spBurst(g,it.x,it.y,'#9ad0ff',18);spBeep(g,260,.1)}
   else{g.combo=0;g.slow=1.2;g.shake=ST.rm?0:.3;g.msg=t('sp_bump');spBurst(g,it.x,it.y,'#c9c9c9',10);spBeep(g,160,.15)}}}
 g.items=keep;
 g.parts=g.parts.filter(q=>{q.l-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;return q.l>0});
 for(const b of g.bg){b.y+=v*dt*b.z*.5;if(b.y>SP_H){b.y=-4;b.x=Math.random()*SP_W}}}

function plMark(id,iso,slot,on){const k=D.pl.tasks.find(x=>x.id===id);if(!k||!plCanMark(k)||!plOcc(k,iso)||iso>plISO(plNow())||!plSlots(k).includes(slot))return;const m=k.done[iso]||(k.done[iso]={});if(on)m[slot]='c';else{delete m[slot];if(!Object.keys(m).length)delete k.done[iso]}plSyncDay(!on);R()}
function plOff(id){const k=D.pl.tasks.find(x=>x.id===id);if(!k||!plMine(k))return;k.off=1;ST.plDel=0;plSyncDay();R()}
function plSave(){const e=ST.ple;if(!e)return;const title=String(e.title||'').replace(/\s+/g,' ').trim().slice(0,60),err=n=>{ST.plerr=n;R()};
 if(!title||!plParse(e.date)||!PLCK[e.cat]||PLCK[e.cat][3])return err(1);
 const rep=PLR.includes(e.rep)?e.rep:'once',end=rep!=='once'&&plParse(e.end)?e.end:'';
 if(rep==='range'&&!end)return err(2);if(end&&end<e.date)return err(3);
 const days=rep==='days'?[...new Set((e.days||[]).filter(x=>Number.isInteger(x)&&x>=0&&x<=6))].sort():[];if(rep==='days'&&!days.length)return err(4);
 const times=[...new Set((e.times||[]).filter(x=>PLTM.test(x)))].sort().slice(0,PLM),rem=times.length&&PLREM.includes(e.rem)?e.rem:-1,o={title,cat:e.cat,date:e.date,times,rep,days,end,rem};
 if(e.id){const k=D.pl.tasks.find(x=>x.id===e.id);if(!k||!plMine(k))return;Object.assign(k,o);for(const iso in k.done){for(const s in k.done[iso])if(!plSlots(k).includes(s))delete k.done[iso][s];if(!Object.keys(k.done[iso]).length)delete k.done[iso]}}
 else D.pl.tasks.push(Object.assign({id:D.pl.nid++,by:'child',done:{},off:0},o));
 ST.ple=null;ST.plerr=0;ST.pld=o.date;if(rem>=0)plWatch();plSyncDay();R()}
function plWatch(){if(!D.pl.ti)D.pl.ti=setInterval(plCheck,20000);plCheck()}
function plCheck(){const n=plNow(),iso=plISO(n),m=n.getHours()*60+n.getMinutes();D.pl.tasks.forEach(k=>{if(k.off||k.rem<0||!plOcc(k,iso))return;const dn=k.done[iso]||{};k.times.forEach(s=>{const p=s.split(':'),at=+p[0]*60+ +p[1],key=k.id+'|'+iso+'|'+s;if(dn[s]||m<at-k.rem||m>at+30||D.pl.fired[key])return;D.pl.fired[key]=1;plRing(k,s)})})}
function plRing(k,s){const raw=plRaw(k);try{if(typeof Notification!=='undefined'&&Notification.permission==='granted')new Notification('UNS',{body:raw+' '+s,lang:ST.lang})}catch(e){}
 let e=document.getElementById('plr');if(!e){e=document.createElement('div');e.id='plr';e.setAttribute('role','status');e.setAttribute('aria-live','polite');e.style.cssText='position:fixed;inset-inline:12px;bottom:12px;z-index:20';document.body.appendChild(e)}
 e.innerHTML=`<div class="card c2">⏰ ${t('pl_ring')} <b>${esc(raw)}</b> ${esc(s)} <button onclick="this.closest('#plr').remove()">${t('p_close')}</button></div>`}

function plRow(o){const k=o.k,c=PLCK[k.cat],mine=plMine(k),can=plCanMark(k),td=plISO(plNow()),act=o.iso<=td&&can,one=o.sl.length===1&&o.sl[0].s==='*',multi=o.sl.length>1;
 const meta=[t(c[2]),k.by==='parent'?t('pl_byp'):'',k.demo?t('demo'):''].filter(Boolean).join(' · ');
 const btn=x=>`<button${x.ok?' class="on"':''} aria-pressed="${x.ok}" ${act?'':'disabled '}aria-label="${t('pl_mark')}: ${esc(plRaw(k))} ${x.s==='*'?'':x.s}" onclick="plMark(${k.id},'${o.iso}','${x.s}',${x.ok?0:1})">${x.ok?'✅':'⬜'} ${x.s==='*'?t('pl_done'):x.s}</button>`;
 const opts=mine?`<details><summary>${t('pl_opts')}</summary><p><button onclick="plEdit(${k.id})">${t('pl_edit')}</button> ${ST.plDel===k.id?`<span role="alert">${t('pl_sure')}</span> <button onclick="plOff(${k.id})">${t('pl_yes')}</button> <button onclick="ST.plDel=0;R()">${t('pl_no')}</button>`:`<button onclick="ST.plDel=${k.id};R()">${t('pl_cancel_t')}</button>`}</p></details>`:`<small>🔒 ${t('pl_locked')}</small>`;
 return`<div class="card c${PLC.indexOf(c)%5}" style="margin:6px 0"><b>${c[1]} ${plTitle(k)}</b>${multi?` <small>${o.nd}/${o.sl.length}</small>`:''}${o.full?' ✅':''}${k.rem>=0&&k.times.length?' <small>🔔</small>':''}<br><small>${meta}</small>${k.cat==='med'&&o.nd?`<br><small>⏳ ${t('pl_wait')}</small>`:''}<div class="chips" role="group" aria-label="${esc(plRaw(k))}">${o.sl.map(btn).join('')}</div>${opts}</div>`}
function plForm(){const e=ST.ple,err=ST.plerr?`<p role="alert" class="card c4">${t('pl_e'+ST.plerr)}</p>`:'';
 return`<div class="card c2" role="group" aria-label="${t(e.id?'pl_edit':'pl_add')}"><h3>${t(e.id?'pl_edit':'pl_add')}</h3>${err}<label for="plt"><b>${t('pl_title')}</b></label><input type="text" id="plt" maxlength="60" autocomplete="off" value="${esc(e.title)}" oninput="ST.ple.title=this.value">
<p><b>${t('pl_cat')}</b></p><div class="chips">${PLC.map(c=>c[3]?`<button disabled aria-disabled="true">🔒 ${c[1]} ${t(c[2])}</button>`:chip(e.cat===c[0],`ST.ple.cat='${c[0]}';R()`,c[1]+' '+t(c[2]))).join('')}</div><p><small>🔒 ${t('pl_locked')}</small></p>

<p><b>${t('pl_rep')}</b></p><div class="chips">${PLR.map(r=>chip(e.rep===r,`ST.ple.rep='${r}';R()`,t('rp_'+r))).join('')}</div>
${e.rep==='days'?`<div class="chips" role="group" aria-label="${t('pl_days')}">${[0,1,2,3,4,5,6].map(i=>chip(e.days.includes(i),`tg(ST.ple.days,${i});R()`,plFmt(new Date(2023,0,1+i),{weekday:'short'}))).join('')}</div>`:''}
${e.rep!=='once'?`<p><label for="ple"><b>${t(e.rep==='range'?'pl_endr':'pl_end')}</b></label> <input type="date" id="ple" value="${esc(e.end)}" onchange="ST.ple.end=this.value"></p>`:''}
<p><b>${t('pl_rem')}</b></p><div class="chips">${PLREM.map(r=>chip(e.rem===r,`ST.ple.rem=${r};R()`,t('pl_r'+(r<0?'x':r)))).join('')}</div><p><small>${t('pl_remnote')}</small></p>
<p><button class="pri" onclick="plSave()">${t('p_save')}</button> <button onclick="ST.ple=null;ST.plerr=0;R()">${t('p_cancel')}</button></p></div>`}
function plCal(){const sel=ST.pld,d=plParse(sel),v=ST.plv,today=plISO(plNow()),ar=ST.lang==='ar';
 const vs=`<div class="chips" role="group" aria-label="${t('pl_view')}">${['day','week','month','year'].map(x=>chip(v===x,`ST.plv='${x}';R()`,t('pl_'+x))).join('')}</div>`;
 const lbl=v==='day'?plFmt(d,{weekday:'long',day:'numeric',month:'long',year:'numeric'}):v==='week'?plFmt(plParse(plWs(sel)),{day:'numeric',month:'short'})+' – '+plFmt(plParse(plAdd(plWs(sel),6)),{day:'numeric',month:'short',year:'numeric'}):v==='month'?plFmt(d,{month:'long',year:'numeric'}):plFmt(d,{year:'numeric'});
 const nv=`<p><button onclick="plShift(-1)" aria-label="${t('pl_prev')}">${ar?'▶':'◀'}</button> <b aria-live="polite">${lbl}</b> <button onclick="plShift(1)" aria-label="${t('pl_next')}">${ar?'◀':'▶'}</button> <button onclick="ST.pld='${today}';R()">${t('pl_today')}</button></p>`;
 const list=L=>L.length?L.map(plRow).join(''):`<p>${t('pl_none')}</p>`;let body='';
 if(v==='day')body=list(plDay(sel));
 else if(v==='week'){const s=plWs(sel);body=[0,1,2,3,4,5,6].map(i=>{const iso=plAdd(s,i),L=plDay(iso);return`<div class="card${iso===sel?' c2':''}" style="margin:6px 0"><button onclick="ST.pld='${iso}';ST.plv='day';R()"${iso===today?' aria-current="date"':''}><b>${plFmt(plParse(iso),{weekday:'long',day:'numeric',month:'short'})}</b> · ${L.length}</button>${L.map(o=>`<div><small>${PLCK[o.k.cat][1]} ${plTitle(o.k)}${o.sl.length>1?' '+o.nd+'/'+o.sl.length:o.sl[0].s==='*'?'':' '+o.sl[0].s}${o.full?' ✅':''}</small></div>`).join('')}</div>`}).join('')}
 else if(v==='month'){const y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay();
  const cells=[...Array(first).fill('<span></span>'),...[...Array(plLast(y,m)).keys()].map(i=>{const dt=new Date(y,m,i+1),iso=plISO(dt),c=plDay(iso).length;return`<button style="min-height:48px;padding:2px" class="${iso===sel?'on':''}"${iso===today?' aria-current="date"':''} aria-pressed="${iso===sel}" aria-label="${plFmt(dt,{weekday:'long',day:'numeric',month:'long'})}, ${c} ${t('pl_tasksw')}" onclick="ST.pld='${iso}';R()">${i+1}<br><small aria-hidden="true">${c?'●'.repeat(Math.min(c,3)):'&nbsp;'}</small></button>`})];
  body=`<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${[0,1,2,3,4,5,6].map(i=>`<small title="${plFmt(new Date(2023,0,1+i),{weekday:'long'})}"><b>${plFmt(new Date(2023,0,1+i),{weekday:'narrow'})}</b></small>`).join('')}${cells.join('')}</div><h3>${plFmt(d,{weekday:'long',day:'numeric',month:'long'})}</h3>`+list(plDay(sel))}
 else{const y=d.getFullYear();body=`<div class="grid">${[...Array(12).keys()].map(mi=>{let c=0;for(let i=1;i<=plLast(y,mi);i++)c+=plDay(plISO(new Date(y,mi,i))).length;return`<button class="nav c${mi%5}" onclick="ST.pld='${plISO(new Date(y,mi,1))}';ST.plv='month';R()"><b>${plFmt(new Date(y,mi,1),{month:'long'})}</b><small>${c} ${t('pl_tasksw')}</small></button>`}).join('')}</div>`}
 return vs+nv+body}
function plTodo(){const today=plISO(plNow()),f=ST.plf,fd=ST.plfd,ok=o=>!f||o.k.cat===f,lab=iso=>iso===today?t('pl_today'):iso===plAdd(today,1)?t('pl_tmr'):plFmt(plParse(iso),{weekday:'long',day:'numeric',month:'short'});
 const days=fd?[fd]:[...Array(PL_UP+1).keys()].map(i=>plAdd(today,i));
 const up=days.map(iso=>({iso,L:plDay(iso).filter(o=>!o.full&&ok(o))})).filter(g=>g.L.length);
 const dn=[];for(let i=0;i<=PL_UP;i++){const iso=plAdd(today,-i);plDay(iso).filter(o=>o.nd&&ok(o)).forEach(o=>dn.push(o))}
 const flt=`<div class="chips" role="group" aria-label="${t('pl_cat')}">${chip(!f,"ST.plf='';R()",t('pl_all'))}${PLC.map(c=>chip(f===c[0],`ST.plf='${c[0]}';R()`,c[1]+' '+t(c[2]))).join('')}</div><p><label for="plfd">${t('pl_fd')}</label> <input type="date" id="plfd" value="${esc(fd)}" onchange="ST.plfd=plParse(this.value)?this.value:'';R()">${fd?` <button onclick="ST.plfd='';R()">${t('pl_fdc')}</button>`:''}</p>`;
 return flt+`<h3>⏳ ${t('pl_upc')}</h3>`+(up.length?up.map(g=>`<h4>${lab(g.iso)}</h4>`+g.L.map(plRow).join('')).join(''):`<p>${t('pl_none')}</p>`)+(dn.length?`<details><summary>✅ ${t('pl_comp')} (${dn.length})</summary>${dn.map(plRow).join('')}</details>`:'')}
function plNotifBox(){const s=ST.plnt||(typeof Notification!=='undefined'?Notification.permission:'na');return`<div class="card c0"><p>🔔 ${t('pl_rem2')}</p>${s==='granted'?`<p>✅ ${t('pl_notif_on')}</p>`:s==='denied'||s==='na'?`<p><small>${t('pl_notif_no')}</small></p>`:`<p><button onclick="plNotifAsk()">${t('pl_notif')}</button></p>`}</div>`}

 return`<div class="card c1"><h3>🏅 ${t('pl_dayc')}</h3><p>${dn?'✅ '+t('pl_dayok'):s.n?t('pl_dayp').replace('{a}',s.d).replace('{b}',s.n):t('pl_dayn')}</p>${inSet?`<p><small>${t('pl_rewn')}</small></p>`:''}</div>`}

const LIB=[
{i:'skin',s:'body',e:'🖐️',t:['جلدي','My skin'],b:['الجلد أكبر عضو في جسمك. يغطيك كالثوب، ويحميك من الجراثيم والجروح، ويساعدك على الإحساس باللمس والحرارة.','Skin is the biggest organ of your body. It covers you like a coat, helps keep germs out and lets you feel touch and warmth.'],f:['جلدك يجدّد نفسه باستمرار، لذلك تُشفى الخدوش الصغيرة.','Your skin keeps renewing itself, which is why small scrapes heal.'],k:['المس شيئًا ناعمًا ثم خشنًا، وانتبه كيف يشعر جلدك.','Touch something soft, then something rough, and notice how your skin feels.']},
{i:'bones',s:'body',e:'🦴',t:['عظامي وعضلاتي','My bones and muscles'],b:['العظام تعطي جسمك شكله وتحمي أعضاءه، والعضلات تشدّ العظام فتتحرك. الحركة والغذاء الجيد يساعدانهما على النمو.','Bones give your body its shape and protect what is inside; muscles pull on bones so you can move. Moving and good food help them grow.'],f:['الطفل يولد بعظام أكثر من الكبار، ثم يلتحم بعضها أثناء النمو حتى يبقى عند الكبار 206 عظمات تقريبًا.','Babies are born with more bones than grown-ups; some join together as you grow, leaving about 206 in adults.'],k:['ضع يدك على ركبتك واثنِها، وأحسّ بالعضلة تتحرك.','Put your hand on your knee, bend it and feel the muscle move.']},
{i:'blood',s:'body',e:'🩸',t:['دمي','My blood'],b:['الدم يسري في جسمك كله. يحمل الأكسجين والغذاء إلى كل مكان، وفيه خلايا تساعد على مقاومة الجراثيم وإيقاف النزف.','Blood travels all around your body. It carries oxygen and nutrients everywhere, and has cells that help fight germs and stop bleeding.'],f:['لهذا يأخذ الفريق الطبي أحيانًا قليلًا من الدم ليفهم كيف يعمل جسمك.','That is why the medical team sometimes takes a little blood to understand how your body is doing.'],k:['اضغط بإصبعين على معصمك برفق وستشعر بنبضك.','Gently press two fingers on your wrist and you can feel your pulse.']},
{i:'lungs',s:'org',e:'🫁',t:['رئتاي','My lungs'],b:['الرئتان تدخلان الهواء عند الشهيق، وتأخذان منه الأكسجين الذي يحتاجه جسمك، ثم تُخرجان الهواء عند الزفير.','Your lungs take in air when you breathe in, keep the oxygen your body needs and let air out when you breathe out.'],f:['تتنفس مئات المرات كل ساعة دون أن تفكر في ذلك.','You breathe hundreds of times every hour without thinking about it.'],k:['ضع يدك على بطنك وخذ نفسًا بطيئًا: عدّ 4 للشهيق و4 للزفير.','Put a hand on your tummy and breathe slowly: count 4 in and 4 out.']},
{i:'brain',s:'org',e:'🧠',t:['دماغي','My brain'],b:['الدماغ مركز التحكم في جسمك. به تفكّر وتتذكّر وتشعر، ويرسل رسائل للعضلات لتتحرك.','Your brain is the control centre of your body. You think, remember and feel with it, and it sends messages to your muscles so they move.'],f:['الدماغ يعمل حتى وأنت نائم، ويرتّب ما تعلّمته في يومك.','Your brain keeps working while you sleep and helps sort out what you learned that day.'],k:['انظر إلى ثلاثة أشياء حولك ثم أغمض عينيك وتذكّرها.','Look at three things around you, close your eyes and remember them.']},
{i:'tummy',s:'org',e:'🍽️',t:['معدتي وأمعائي','My tummy and intestines'],b:['المعدة تمزج الطعام وتفتّته، ثم تأخذ الأمعاء منه ما يحتاجه جسمك من غذاء، والباقي يخرج من الجسم.','Your stomach mixes and breaks down food, then the intestines take the nutrients your body needs and the rest leaves your body.'],f:['الأمعاء طويلة جدًا لكنها ملفوفة داخل بطنك.','Your intestines are very long, but they are folded up inside your tummy.'],k:['اشرب الماء وكُل ببطء، فهذا يساعد جهازك الهضمي.','Drink water and eat slowly; it helps your digestive system.']},
{i:'kidney',s:'org',e:'💧',t:['كليتاي','My kidneys'],b:['لديك كليتان صغيرتان بحجم قبضتك تقريبًا. تنظّفان الدم وتخرجان الفائض مع الماء على شكل بول.','You have two small kidneys, about the size of your fist. They clean your blood and send extra water and waste out as urine.'],f:['الكليتان تعملان ليلًا ونهارًا لتبقى سوائل جسمك متوازنة.','Kidneys work day and night to keep your body’s fluids in balance.'],k:['إن أخبرك فريقك بكمية ماء معيّنة لك، فاتبعها هي.','If your team tells you how much to drink, follow that first.']},
{i:'team',s:'hos',e:'🧑‍⚕️',t:['من يعمل في المستشفى؟','Who works in the hospital?'],b:['في المستشفى فريق كامل: الطبيب يفحصك ويضع الخطة، والممرض يرافقك ويعطيك الدواء، وفنّي المختبر يفحص الدم، وفنّي الأشعة يصوّر الداخل، والصيدلي يجهّز الدواء.','A whole team works here: the doctor checks you and makes the plan, the nurse stays with you and gives medicine, the lab technician tests blood, the radiographer takes pictures of the inside, and the pharmacist prepares medicine.'],f:['كلهم يعملون معًا من أجلك.','They all work together for you.'],k:['اسأل أي شخص جديد: «ما اسمك وماذا ستفعل؟»','Ask anyone new: “What is your name and what will you do?”']},
{i:'xray',s:'hos',e:'📷',t:['الأشعة والتصوير','X-rays and scans'],b:['الأشعة جهاز يلتقط صورة لما داخل جسمك دون أن يفتحه. في الغالب لا تشعر بألم، لكن عليك أن تبقى ساكنًا لحظات قصيرة. وبعض الأجهزة تصدر أصواتًا عالية.','A scan takes a picture of the inside of your body without opening it. It usually does not hurt, but you need to stay still for a short time, and some machines are noisy.'],f:['يمكنك أن تطلب من الفنّي أن يريك الجهاز قبل البدء.','You can ask the technician to show you the machine first.'],k:['تمرّن على البقاء ساكنًا وعدّ ببطء إلى عشرة.','Practise staying still and counting slowly to ten.']},
{i:'drip',s:'hos',e:'💉',t:['المغذّي والإبرة الصغيرة','The drip and the tiny needle'],b:['أحيانًا يضع الممرض أنبوبًا رفيعًا في الوريد ليصل الدواء أو السائل إلى جسمك. قد تشعر بوخزة عند وضعه، ويمكنك أن تسأل وأن يبقى معك شخص كبير.','Sometimes a nurse puts a thin tube in a vein so medicine or fluid can reach your body. It may pinch when it goes in, and you can ask questions and have a grown-up stay with you.'],f:['يمكنك أن تخبر الممرض إن شعرت بانزعاج من مكانه.','You can tell your nurse if the spot feels uncomfortable.'],k:['انظر بعيدًا وخذ نفسًا بطيئًا أثناء الوخزة.','Look away and take a slow breath during the pinch.']},
{i:'pain',s:'hos',e:'😣',t:['عندما أشعر بألم','When something hurts'],b:['الألم رسالة من جسمك، وأخبار الألم مهمة لفريقك. قل أين يؤلمك وكم، أو أشر إلى وجه يشبه شعورك على مقياس الوجوه. وهم يستطيعون مساعدتك.','Pain is a message from your body, and your team needs to hear it. Say where it hurts and how much, or point to the face on the face scale that looks like how you feel. They can help.'],f:['لا تنتظر حتى يشتد الألم: أخبر ممرضك مبكرًا.','Do not wait until it gets big: tell your nurse early.'],k:['فكّر: أين؟ كم؟ متى بدأ؟ ثم أخبر ممرضك.','Think: where? how much? since when? Then tell your nurse.']},
{i:'wash',s:'wash',e:'🧼',t:['كيف أغسل يديّ؟','How do I wash my hands?'],b:['اتبع هذه الخطوات في كل مرة لتُبعد الجراثيم عن يديك:','Follow these steps each time to take germs off your hands:'],st:[['بلّل يديك بماء نظيف (دافئ أو بارد) وأغلق الصنبور.','Wet your hands with clean water (warm or cold) and turn off the tap.'],['ضع الصابون وافركه حتى تظهر رغوة.','Add soap and rub until it lathers.'],['افرك كل مكان لمدة 20 ثانية على الأقل: ظهر اليدين، بين الأصابع، تحت الأظافر، الإبهامين.','Scrub for at least 20 seconds: backs of hands, between fingers, under nails and thumbs.'],['اشطف يديك جيدًا بالماء الجاري.','Rinse well under running water.'],['جفّف يديك بمنشفة نظيفة أو بالهواء.','Dry with a clean towel or let them air dry.']],f:['عدّ ببطء إلى 20، أو غنِّ أغنية قصيرة مرتين.','Count slowly to 20, or sing a short song twice.'],k:['جرّب الآن أمام المغسلة، وانتبه لأظافرك وبين أصابعك.','Try it now at the sink and watch your nails and between your fingers.']},
{i:'when',s:'wash',e:'⏰',t:['متى أغسل يديّ؟','When do I wash my hands?'],b:['اغسل يديك قبل الأكل وقبل لمس طعامك، وبعد استخدام الحمّام، وبعد السعال أو العطاس أو مسح الأنف، وبعد اللعب في الخارج أو لمس الحيوانات، وعندما تبدو يداك متسخة.','Wash before eating or touching food, after using the toilet, after coughing, sneezing or blowing your nose, after playing outside or touching animals, and whenever your hands look dirty.'],f:['اليدان تلمسان كل شيء، فهي تنقل الجراثيم بسهولة إلى الفم والعينين.','Hands touch everything, so they easily carry germs to your mouth and eyes.'],k:['ضع ملصقًا قرب الحمّام يذكّرك: أكل، حمّام، لعب.','Put a note near the bathroom: eating, toilet, play.']},
{i:'cough',s:'wash',e:'🤧',t:['السعال والعطاس','Coughs and sneezes'],b:['عندما تسعل أو تعطس غطِّ فمك وأنفك بمنديل أو بثنية مرفقك، لا بيدك. ثم ارمِ المنديل واغسل يديك.','When you cough or sneeze, cover your mouth and nose with a tissue or the inside of your elbow, not your hand. Then throw the tissue away and wash your hands.'],f:['هكذا تحمي أصدقاءك وفريقك من الجراثيم.','This protects your friends and your team from germs.'],k:['تدرّب: اجعل مرفقك «كمّامة» لثوانٍ.','Practise: make your elbow a “shield” for a few seconds.']},
{i:'prevent',s:'wash',e:'🛡️',t:['كيف أبقى بصحة جيدة؟','How can I stay healthy?'],b:['لا تشارك كوبك أو ملعقتك، وأبقِ جروحك نظيفة ومغطّاة، وأخبر شخصًا كبيرًا إن شعرت بتعب أو حرارة. وإن طلب فريقك كمامة أو احتياطات خاصة فاتبعها، فقد تكون مهمة لجسمك.','Do not share cups or spoons, keep cuts clean and covered, and tell a grown-up if you feel unwell or hot. If your team asks you to wear a mask or take special precautions, follow them; they may matter for your body.'],f:['اللقاحات تدرّب جسمك لمقاومة أمراض معيّنة، وفريقك يعرف ما يناسبك.','Vaccines help your body practise fighting certain illnesses, and your team knows what is right for you.'],k:['اسأل فريقك: «ما الاحتياطات التي تناسبني أنا؟»','Ask your team: “Which precautions are right for me?”']},
{i:'plate',s:'food',e:'🍽️',t:['طبقي الصحي','My healthy plate'],b:['الجسم يحتاج أنواعًا مختلفة من الطعام: خضار وفواكه، وحبوب مثل الخبز والأرز، وبروتين مثل اللحم والبيض والعدس، وحليب أو لبن. كلما تنوّع طبقك كان أفضل.','Your body needs different kinds of food: vegetables and fruit, grains like bread and rice, protein like meat, eggs and lentils, and milk or yoghurt. The more varied your plate, the better.'],f:['جرّب لونًا جديدًا في طبقك كل يوم.','Try a new colour on your plate each day.'],k:['ارسم طبقك وسمِّ ألوانه.','Draw your plate and name its colours.'],n:['إن وضع لك طبيبك نظامًا غذائيًا خاصًا، فاتبعه هو أولًا.','If your doctor gave you a special diet, follow that first.']},
{i:'water',s:'food',e:'🚰',t:['الماء صديقي','Water is my friend'],b:['الماء يساعد جسمك على العمل وعلى الهضم. اشرب منه على مدار اليوم، خصوصًا عندما تلعب أو يكون الجو حارًا.','Water helps your body work and digest. Sip it through the day, especially when you play or it is hot.'],f:['العصائر المحلاة والمشروبات الغازية فيها سكر كثير، والماء أفضل لعطشك.','Sweet juices and fizzy drinks have a lot of sugar; water is best for thirst.'],k:['ضع كوب ماء بجانبك أثناء اللعب.','Keep a cup of water next to you while you play.'],n:['بعض الأطفال يحتاجون كمية ماء محدّدة؛ اسأل فريقك عن كميتك.','Some children need a set amount of water; ask your team about yours.']},
{i:'sugar',s:'food',e:'🍎',t:['الوجبات الخفيفة والسكر','Snacks and sugar'],b:['الحلويات لذيذة، لكن الأفضل أن تكون من حين لآخر. ومن الوجبات الخفيفة الجيدة الفاكهة والخضار المقطّعة والمكسّرات (إن كانت مناسبة لك) واللبن.','Sweets are tasty, but best as an occasional treat. Good snacks include fruit, cut vegetables, nuts (if they suit you) and yoghurt.'],f:['الفطور يمنحك طاقة لبداية يوم أفضل.','Breakfast gives you energy for a better start to the day.'],k:['اختر وجبتك الخفيفة من لونين مختلفين.','Pick a snack with two different colours.'],n:['إن كان لديك حساسية من طعام ما، فتجنّبه واسأل فريقك.','If you are allergic to a food, avoid it and ask your team.']},
{i:'sleep',s:'rest',e:'😴',t:['النوم يشفي ويقوّي','Sleep helps me grow strong'],b:['أثناء النوم يرتاح جسمك ويُصلح نفسه ويرتّب دماغك ما تعلّمته. معظم الأطفال في عمرك يحتاجون إلى نوم طويل كل ليلة، والأفضل أن تنام وتستيقظ في أوقات ثابتة.','While you sleep your body rests and repairs itself and your brain sorts what you learned. Most children your age need a long sleep each night, and regular bedtimes help.'],f:['الغرفة الهادئة والمظلمة تساعد على النوم.','A quiet, dim room helps you sleep.'],k:['قبل النوم: أطفئ الشاشة، وخذ خمسة أنفاس بطيئة.','Before bed: switch off screens and take five slow breaths.']},
{i:'move',s:'rest',e:'🤸',t:['أتحرّك بحسب قدرتي','Moving in my own way'],b:['الحركة تقوّي القلب والعضلات وتحسّن مزاجك. يمكنك أن تتحرك بطرق مختلفة: مشي، رقص، تمدّد، ألعاب هادئة. وإن كان عليك قيود من فريقك، فاسألهم عمّا يناسبك.','Moving makes your heart and muscles stronger and lifts your mood. You can move in many ways: walking, dancing, stretching, gentle games. If your team has set limits, ask what is right for you.'],f:['كل حركة مفيدة، حتى الصغيرة.','Every bit of movement helps, even a small one.'],k:['تمدّد كأنك تلمس السقف، ثم استرخِ.','Stretch as if touching the ceiling, then relax.'],n:['اتبع تعليمات فريقك عن الراحة والنشاط.','Follow your team’s advice about rest and activity.']}
];

ة','A quiet room','ومعتمة قليلًا','and a little dark','#9775fa']],move:[['🚶','مشي','Walking','خطوات خفيفة','gentle steps','#4dabf7'],['💃','رقص','Dancing','حركة ممتعة','fun movement','#f783ac'],['🤸','تمدّد','Stretching','يرخي العضلات','relaxes muscles','#69db7c'],['🧘','هدوء','Calm','نَفَس بطيء','slow breaths','#9775fa']]};
