const G={};const STY=[['وجد أُنس غيمة صغيرة تبكي. ماذا يفعل أُنس؟','Uns found a little cloud that was crying. What should Uns do?',[['يسألها لماذا تبكي','Ask why it is crying',1],['يعانقها','Give it a hug',2]]],['قالت الغيمة: أشعر بالوحدة لأن أصدقائي بعيدون. ماذا يفعل أُنس؟','The cloud said, "I feel lonely because my friends are far away." What should Uns do?',[['يدعوها للعب','Invite it to play',3],['يجلس معها بهدوء','Sit quietly with it',4]]],['ارتاحت الغيمة قليلًا لكنها بقيت حزينة. ماذا يفعل أُنس؟','The cloud felt a little warmer but was still sad. What should Uns do?',[['يجلسان بهدوء معًا','Sit quietly together',4],['يبحثان عن أصدقاء الغيمة','Look for the cloud’s friends',5]]],['لعب أُنس والغيمة معًا، وابتسمت الغيمة. وفي اليوم التالي كانت ما تزال تفتقد أصدقاءها، وهذا مقبول أيضًا.','Uns and the cloud played together and the cloud smiled. The next day it still missed its friends, and that is okay too.',[]],['جلس أُنس والغيمة معًا بهدوء. قالت الغيمة: لا بأس أن أحزن أحيانًا. وشعرت بهدوء أكثر.','Uns and the cloud sat quietly together. The cloud said, "It is okay to be sad sometimes." It felt a little calmer.',[]],['بحث أُنس والغيمة طويلًا. لم يجدا الأصدقاء في ذلك اليوم، لكنهما وعدا بالمحاولة مرة أخرى، وكانت الغيمة سعيدة بوجود أُنس.','Uns and the cloud looked for a long time. They did not find the friends that day, but they promised to try again, and the cloud was glad to have Uns.',[]]];const PIC=[['🐱','cat'],['🐶','dog'],['🐟','fish'],['🐦','bird'],['🐰','rabbit']];

[1,'🏥','غرفتي في المستشفى','My hospital room','المستشفى مكان يساعد فيه الممرضون والأطباء الناس. قد تجد في غرفتك سريرًا وزر نداء وأجهزة تساعد فريقك. يمكنك أن تسأل عن فائدة أي شيء.','A hospital is a place where nurses and doctors help people. Your room may have a bed, a call button and machines that help your team. You can ask what anything is for.','ماذا أفعل إن أردت أن أعرف فائدة جهاز؟','What can I do if I wonder what a machine is for?',['أخبّئ سؤالي','Keep my question secret'],['أسأل ممرضي','Ask my nurse'],1],
[2,'🌡️','لماذا يقيس الممرض حرارتي؟','Why do nurses check my temperature?','أحيانًا يصبح جسمنا أدفأ عندما نكون مرضى. يستخدم الممرض ميزانًا خاصًا لقياس الحرارة ليفهم كيف يشعر جسمك. الأمر يختلف من طفل لآخر.','Sometimes our body gets warmer when we are sick. Your nurse uses a special thermometer to check your temperature and understand how your body is feeling. It can be different for every child.','لماذا يقيس الممرض الحرارة؟','Why does the nurse check my temperature?',['ليفهم كيف يشعر جسمي','To understand how my body feels'],['ليغيّر لون جلدي','To change my skin color'],0],
[2,'🧑‍⚕️','من هو ممرضي؟','Who is my nurse?','الممرض شخص يهتم بك. يتابع كيف تشعر، ويساعدك في الدواء، ويستمع إليك. أخبره إن أقلقك شيء.','A nurse is a person who cares for you. They check how you feel, help with your medicine and listen to you. You can tell your nurse when something worries you.','متى أخبر ممرضي؟','When can I tell my nurse something?',['عندما يقلقني شيء','When something worries me'],['لا أخبره أبدًا','Never'],0],
[3,'🩸','ما هو فحص الدم؟','What is a blood test?','أحيانًا نستخدم إبرة صغيرة لأخذ قليل من الدم. قد تشعر بوخزة، ويختلف الأمر من طفل لآخر. يمكنك أن تسأل، وأن يبقى معك شخص كبير.','Sometimes a test uses a tiny needle to take a little blood. It may feel like a pinch, and it can feel different for each child. You can ask questions and ask a grown-up to stay with you.','ماذا يمكنني أن أفعل قبل الفحص؟','What can I do before a test?',['أنتظر دون أن أسأل','Wait without asking'],['أسأل عمّا يهمّني','Ask what I want to know'],1],
[4,'💊','من يقرر دوائي؟','Who decides my medicine?','الدواء يساعد جسمك. الطبيب والممرض هما من يقرران أي دواء وكم مقداره. لا تأخذ أي دواء بمفردك أبدًا.','Medicine is given to help your body. Your doctor and nurse decide which one and how much. Never take medicine on your own.','من يقرر دوائي؟','Who decides my medicine?',['أنا وحدي','Only me'],['الطبيب والممرض','My doctor and nurse'],1],
[5,'🧼','غسل اليدين','Washing my hands','الماء والصابون يساعدان على إزالة الجراثيم عن يديك. افرك يديك جيدًا ثم اشطفهما.','Water and soap help wash germs off your hands. Rub your hands well, then rinse them.','ماذا نستخدم مع الماء؟','What do we use with water?',['الصابون','Soap'],['اللمعان','Glitter'],0],
[6,'💗','عندما أشعر بالقلق','When I feel worried','كل الناس يشعرون بالقلق أحيانًا، وكل المشاعر مقبولة. يمكنك أن تخبر شخصًا تثق به، أو ترسم ما تشعر به، أو تطلب المساعدة.','Everyone feels worried sometimes, and all feelings are okay. You can tell someone you trust, draw how you feel, or ask for help.','ماذا يمكنني أن أفعل عندما أشعر بالقلق؟','What can I do when I feel worried?',['أكتم الأمر دائمًا','Always keep it inside'],['أخبر شخصًا أثق به','Tell someone I trust'],1]];

 for(const a of pool){if(out.length>=DT_N)break;if(!used.has(a.id)){used.add(a.id);out.push(a.id)}}return out.slice(0,DT_N)}

/* Star Rocket: an action game with no game-over, no scores shown as grades. A bump only slows the rocket down. */
const SP_P=[['🌙','القمر','the Moon'],['🔴','المريخ','Mars'],['🪐','زحل','Saturn'],['🌈','سديم قوس قزح','the Rainbow Nebula'],['🏰','قلعة النجوم','the Star Castle']],
 SP_NEED=25,SP_W=360,SP_H=540,SP_LX=[.2,.5,.8].map(x=>x*SP_W),SP_PY=SP_H-100,SP_BG=[['#1b2a5c','#4a5fa8'],['#4a1f2e','#c45a4a'],['#2a2350','#8a6bc4'],['#1d3a5c','#5ac8c4'],['#3a2260','#e07ab8']],
 SP_E={s:'⭐',g:'💎',a:'☄️',m:'🧲',h:'🛡️',b:'⚡',l:'💖',j:'🍮'};
function spNew(){const bg=[];for(let i=0;i<40;i++)bg.push({x:Math.random()*SP_W,y:Math.random()*SP_H,z:.3+Math.random()*.7});
 return{st:'ready',lane:1,x:SP_LX[1],t:0,p:0,got:0,tot:0,combo:0,items:[],parts:[],shield:0,magnet:0,boost:0,slow:0,shake:0,next:.5,msg:'',pause:0,sound:0,bg,flash:0,boss:null,stk:0}}
function spSpeed(g){return(230+g.p*28)*(g.boost>0?1.7:1)*(g.slow>0?.6:1)*(ST.rm?.75:1)}
function spSpawn(g){const L=[0,1,2],free=L.slice();
 if(g.boost<=0&&Math.random()<.4){const n=Math.random()<.35?2:1;for(let k=0;k<n;k++){const i=Math.floor(Math.random()*free.length),l=free.splice(i,1)[0];g.items.push({k:'a',l,x:SP_LX[l],y:-30})}}
 if(!free.length)return;const l=free[Math.floor(Math.random()*free.length)],r=Math.random();
 if(g.boost<=0&&r<.07)g.items.push({k:['m','h','b'][Math.floor(Math.random()*3)],l,x:SP_LX[l],y:-30});
 else if(r<.17)g.items.push({k:'g',l,x:SP_LX[l],y:-30});
 else for(let j=0;j<3;j++)g.items.push({k:'s',l,x:SP_LX[l],y:-30-j*46})}
function spBurst(g,x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=60+Math.random()*140;g.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.6,c})}}
function spGain(g,n){g.got=Math.min(SP_NEED,g.got+n);g.tot+=n;if(g.got>=SP_NEED&&!g.boss)spBossStart(g)}
function spStep(g,dt){g.t+=dt;const v=spSpeed(g);
 ['boost','slow','magnet','shake','flash'].forEach(k=>{if(g[k]>0)g[k]=Math.max(0,g[k]-dt)});
 g.x+=(SP_LX[g.lane]-g.x)*Math.min(1,dt*13);
 if(g.boss)spBossTick(g,dt);g.next-=dt;if(g.next<=0){if(g.boss){spHeart(g);g.next=.65}else{spSpawn(g);g.next=Math.max(.38,.75-g.p*.06)*(g.boost>0?.5:1)}}
 for(const it of g.items){it.y+=v*dt;
  if(g.magnet>0&&(it.k==='s'||it.k==='g'||it.k==='l')&&Math.abs(it.y-SP_PY)<170){it.x+=(g.x-it.x)*Math.min(1,dt*7)}}
 const keep=[];
 for(const it of g.items){const hit=Math.abs(it.y-SP_PY)<34&&Math.abs(it.x-g.x)<34;
  if(!hit){if(it.y<SP_H+60)keep.push(it);continue}
  if(it.k==='s'){g.combo++;spGain(g,1+(g.combo%6===0?1:0));spBurst(g,it.x,it.y,'#ffe066',8);spBeep(g,500+Math.min(g.combo,12)*40,.07);if(g.combo%6===0)g.msg=t('sp_combo')}
  else if(it.k==='g'){g.combo++;spGain(g,3);spBurst(g,it.x,it.y,'#7fe7ff',16);spBeep(g,880,.12);g.msg=t('sp_gem')}
  else if(it.k==='l'){const b=g.boss;if(b){b.got++;b.laugh=.5;g.combo++;spBurst(g,it.x,it.y,'#ff7ab8',12);spBeep(g,700+b.got*40,.1);if(b.got>=b.hp)spBossWin(g);else g.msg=t('sp_hit')}}
  else if(it.k==='m'){g.magnet=7;g.msg=t('sp_mag');spBurst(g,it.x,it.y,'#ff9ad5',12);spBeep(g,620,.15)}
  else if(it.k==='h'){g.shield=1;g.msg=t('sp_shd');spBurst(g,it.x,it.y,'#9ad0ff',12);spBeep(g,700,.15)}
  else if(it.k==='b'){g.boost=3.5;g.msg=t('sp_bst');spBurst(g,it.x,it.y,'#ffb347',20);spBeep(g,760,.2)}
  else if(it.k==='a'||it.k==='j'){if(g.boost>0){spBurst(g,it.x,it.y,'#ffd9a0',14);spBeep(g,300,.08)}
   else if(g.shield){g.shield=0;g.msg=t('sp_pop');spBurst(g,it.x,it.y,'#9ad0ff',18);spBeep(g,260,.1)}
   else{g.combo=0;g.slow=1.2;g.shake=ST.rm?0:.3;g.msg=t('sp_bump');spBurst(g,it.x,it.y,'#c9c9c9',10);spBeep(g,160,.15)}}}
 g.items=keep;
 g.parts=g.parts.filter(q=>{q.l-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;return q.l>0});
 for(const b of g.bg){b.y+=v*dt*b.z*.5;if(b.y>SP_H){b.y=-4;b.x=Math.random()*SP_W}}}
function spMove(d){const g=G.sp;if(!g||g.st!=='play'||g.pause)return;g.lane=Math.max(0,Math.min(2,g.lane+d))}

function stkAlbum(){const own=stkLoad(),p=progLoad(),i=ST.lang==='ar'?2:3,n=SK.filter(s=>own[s[0]]).length,q=ST.lang==='ar'?'؟':'?';
 return`<section class="card c4" id="stk" style="margin-top:14px"><h2>🏅 ${t('stk_t')}</h2><p>${t('stk_n')}</p><p><b id="stkn">${n}</b> ${t('stk_of')} ${SK.length}</p><div class="card c2" id="stkp"><p>📋 ${t('pg_t1')}: <b>${p.tasks%25}/25</b></p><p>🔵 ${t('pg_t2')}: <b>${p.rare%2}/2</b></p><p>🟣 ${t('pg_t3')}: <b>${p.epic%2}/2</b></p></div>${[['c','rar_c'],['r','rar_r'],['e','rar_e'],['l','rar_l']].map(([r,k])=>{const L=SK.filter(s=>s[4]===r);
 return`<h3 class="rar-tag rar-${r}">${t(k)} <small>${L.filter(s=>own[s[0]]).length}/${L.length}</small></h3><div class="stk-grid">${L.map(s=>own[s[0]]?`<div class="stk rar-${r}" role="img" aria-label="${s[i]}${own[s[0]]>1?' ×'+own[s[0]]:''}"><span class="stk-e">${s[1]}</span><small>${s[i]}${own[s[0]]>1?' ×'+own[s[0]]:''}</small></div>`:`<div class="stk off" role="img" aria-label="${t('stk_lock')}"><span class="stk-e">${s[1]}</span><small>${r==='l'?q+q+q:q}</small></div>`).join('')}</div>`}).join('')}</section>`}
let spRaf=0,spCtx=null,spAudio=null;
function spBeep(g,f,d){if(!g.sound)return;try{spAudio=spAudio||new(window.AudioContext||window.webkitAudioContext)();const o=spAudio.createOscillator(),a=spAudio.createGain();o.frequency.value=f;o.type='sine';a.gain.value=.05;o.connect(a);a.connect(spAudio.destination);o.start();o.stop(spAudio.currentTime+d)}catch(e){}}
function spDraw(g){const c=spCtx;if(!c)return;const bg=SP_BG[Math.min(g.p,SP_BG.length-1)],gr=c.createLinearGradient(0,0,0,SP_H);gr.addColorStop(0,bg[0]);gr.addColorStop(1,bg[1]);
 c.save();c.direction='ltr';if(g.shake>0)c.translate((Math.random()-.5)*10,(Math.random()-.5)*10);
 c.fillStyle=gr;c.fillRect(0,0,SP_W,SP_H);c.fillStyle='#fff';
 for(const b of g.bg){c.globalAlpha=.3+b.z*.6;c.fillRect(b.x,b.y,1+b.z*1.5,1+b.z*1.5)}c.globalAlpha=1;
 c.textAlign='center';c.textBaseline='middle';
 if(g.boss){const b=g.boss,sh=b.laugh>0?Math.sin(g.t*60)*6:0;c.font='84px serif';c.fillText(SP_B[b.k][0],b.bx+sh,70+Math.sin(g.t*2)*4);
  c.fillStyle='rgba(0,0,0,.4)';c.fillRect(80,116,200,12);c.fillStyle='#ff7ab8';c.fillRect(80,116,200*b.got/b.hp,12);
  if(b.tele){c.font='34px serif';c.globalAlpha=.5+.5*Math.sin(g.t*20);for(const l of b.tele.l)c.fillText('⚠️',SP_LX[l],165);c.globalAlpha=1}}
 else{const tp=SP_P[Math.min(g.p,SP_P.length-1)][0],sz=30+g.got/SP_NEED*50;c.font=sz+'px serif';c.fillText(tp,SP_W/2,60+g.got*3)}
 c.strokeStyle='rgba(255,255,255,.18)';c.lineWidth=2;for(const x of SP_LX){c.beginPath();c.moveTo(x,120);c.lineTo(x,SP_H);c.stroke()}
 c.font='34px serif';for(const it of g.items){c.fillText(SP_E[it.k],it.x,it.y)}
 if(g.boost>0){c.fillStyle='rgba(255,200,80,.35)';c.beginPath();c.moveTo(g.x-18,SP_PY+20);c.lineTo(g.x,SP_PY+110);c.lineTo(g.x+18,SP_PY+20);c.fill()}
 else{c.fillStyle='rgba(255,160,60,.8)';c.beginPath();c.moveTo(g.x-8,SP_PY+22);c.lineTo(g.x,SP_PY+44+Math.sin(g.t*40)*5);c.lineTo(g.x+8,SP_PY+22);c.fill()}
 c.font='46px serif';c.fillText('🚀',g.x,SP_PY);
 if(g.shield){c.strokeStyle='#9ad0ff';c.lineWidth=4;c.beginPath();c.arc(g.x,SP_PY,38,0,6.283);c.stroke()}
 if(g.magnet>0){c.strokeStyle='rgba(255,154,213,.7)';c.lineWidth=3;c.beginPath();c.arc(g.x,SP_PY,48+Math.sin(g.t*8)*4,0,6.283);c.stroke()}
 for(const q of g.parts){c.globalAlpha=Math.max(0,q.l/.6);c.fillStyle=q.c;c.fillRect(q.x,q.y,5,5)}c.globalAlpha=1;
 c.fillStyle='rgba(0,0,0,.35)';c.fillRect(10,SP_H-26,SP_W-20,14);c.fillStyle=g.boss?'#ff7ab8':'#ffe066';c.fillRect(10,SP_H-26,(SP_W-20)*(g.boss?g.boss.got/g.boss.hp:g.got/SP_NEED),14);
 c.font='18px serif';c.fillStyle='#fff';c.textAlign='left';c.fillText('⭐ '+g.tot+(g.combo>=3?'  🔥x'+g.combo:''),12,18);c.textAlign='right';
 c.fillText(SP_P.map((p,k)=>k<g.p?p[0]:'·').join(' '),SP_W-12,18);
 if(g.flash>0){c.fillStyle='rgba(255,255,255,'+Math.min(.25,g.flash)+')';c.fillRect(0,0,SP_W,SP_H)}
 c.restore()}
function spLoop(ts){const g=G.sp;if(ST.view!=='star'||!g){spRaf=0;return}
 const dt=Math.min(.05,((ts-(g.ts||ts))/1000)||0);g.ts=ts;
 if(g.st==='play'&&!g.pause){const m=g.msg,pg=g.p;spStep(g,dt);const q=revq().length;if(q)g.pause=1;const e=document.getElementById('spm');if(e&&g.msg!==m)e.textContent=g.msg;if(q||g.p!==pg||g.st==='done')R()}
 spDraw(g);spRaf=requestAnimationFrame(spLoop)}
function spInit(){const cv=document.getElementById('spc');if(!cv||!G.sp)return;spCtx=cv.getContext('2d');
 cv.onpointerdown=e=>{const r=cv.getBoundingClientRect();spMove(e.clientX<r.left+r.width/2?-1:1)};
 if(!spRaf)spRaf=requestAnimationFrame(spLoop);spDraw(G.sp)}
function spStop(){if(spRaf){cancelAnimationFrame(spRaf);spRaf=0}if(G.sp&&G.sp.st==='play')G.sp.pause=1}
function spGo(){const so=G.sp&&G.sp.sound;G.sp=spNew();G.sp.sound=so;G.sp.st='play';G.sp.msg=t('sp_go');R();const c=document.getElementById('spc');if(c&&c.scrollIntoView)c.scrollIntoView({block:'center'})}
function spPause(){const g=G.sp;if(revq().length)return;g.pause=!g.pause;R()}
function spSnd(){const g=G.sp;g.sound=!g.sound;R()}
addEventListener('keydown',e=>{if(ST.view!=='star')return;const k=e.key;if(k==='ArrowLeft'||k==='a'||k==='A'){e.preventDefault();spMove(-1)}else if(k==='ArrowRight'||k==='d'||k==='D'){e.preventDefault();spMove(1)}else if(k==='p'||k==='P'){if(G.sp&&G.sp.st==='play')spPause()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.sp&&G.sp.st==='play'&&!G.sp.pause){G.sp.pause=1;if(ST.view==='star')R()}});
psLoad();
dtEnsure();
addEventListener('focus',()=>{if(dtEnsure()){ST.tk=null;R()}});
enter(routeOf());
linkInit().then(()=>R());
</script></body></html>
