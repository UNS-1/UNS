<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNS — A Little World of Care</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&family=Nunito:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFF8EF;--tx:#66546F;--lav:#DCCEF4;--pink:#F4DCE8;--blue:#DCEFFA;--mint:#DCEFE5;--peach:#F8E1D4;--card:#fff;--ac:#8d73b8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a2431;--tx:#efe6f5;--lav:#4a3d63;--pink:#5a3d51;--blue:#33495a;--mint:#35503f;--peach:#5a4538;--card:#382f42;--ac:#c4a9ef}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.6 Nunito,Tajawal,sans-serif}
[dir=rtl] body,[dir=rtl] button,[dir=rtl] textarea,[dir=rtl] input{font-family:Tajawal,Nunito,sans-serif}
h1,h2,h3{font-family:'Baloo 2',Tajawal,sans-serif;margin:.3em 0}
header{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--lav);position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
main{max-width:900px;margin:0 auto;padding:16px}
button{font:inherit;color:var(--tx);background:var(--card);border:2px solid var(--lav);border-radius:18px;padding:10px 16px;min-height:48px;cursor:pointer}
button:hover,button.on{background:var(--lav);border-color:var(--ac)}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 3px 10px #0001}
.big{font-size:42px;display:block}.nav{min-height:130px;font-size:19px}
.c0{background:var(--pink)}.c1{background:var(--blue)}.c2{background:var(--mint)}.c3{background:var(--peach)}.c4{background:var(--lav)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.hero{text-align:center;padding:24px 8px}
.uns{font-size:96px;animation:fl 4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.rm *{animation:none!important}
.demo{background:var(--peach);padding:6px 12px;border-radius:12px;font-size:14px;margin-bottom:10px}
.flag{border-inline-start:6px solid var(--ac)}small{opacity:.85}
canvas{background:#fff;border-radius:16px;touch-action:none;width:100%;max-width:520px;border:2px solid var(--lav)}
textarea,input[type=text]{width:100%;font:inherit;padding:10px;border-radius:14px;border:2px solid var(--lav);background:var(--card);color:var(--tx)}
.faces button{width:84px;min-height:104px;padding:4px}
footer{text-align:center;font-size:14px;padding:16px;opacity:.85}
</style></head><body>

mem:()=>back('happy')+`<h2>🃏 ${t('gm1')}</h2><div class="grid" style="grid-template-columns:repeat(4,1fr)">${G.c.map((e,i)=>{const s=G.o.includes(i)||G.m.includes(i);return`<button style="min-height:72px;font-size:32px" aria-label="${s?e:t('gcard')}" onclick="flip(${i})">${s?e:'⭐'}</button>`}).join('')}</div>${G.m.length===12?`<p class="card c2"><b>${t('gdone')}</b></p>`:''}<p><button onclick="newMem();R()">${t('gnew')}</button></p>`,
match:()=>{if(G.r>=PIC.length)return back('happy')+`<p class="card c2 hero"><b>${t('gdone')}</b></p><button onclick="G.r=0;R()">${t('gnew')}</button>`;const o=[G.r,(G.r+1)%5,(G.r+3)%5].sort((x,y)=>(x*7+G.r)%5-(y*7+G.r)%5);return back('happy')+`<h2>🧩 ${t('gq')}</h2><p class="hero" style="font-size:80px;margin:0" aria-hidden="true">${PIC[G.r][0]}</p><div class="chips">${o.map(j=>chip(0,`pickM(${j})`,t('g_'+PIC[j][1]))).join('')}</div><p><b>${G.w?t('wrong'):''}</b></p>`},
draw:()=>back('happy')+`<h2>${t('draw')}</h2><canvas id="cv" width="520" height="360" aria-label="${t('draw')}"></canvas><div class="chips">${['#8d73b8','#e58fb5','#6fb4dc','#7fc29b','#f0a98a','#66546F'].map(c=>`<button aria-label="${c}" style="background:${c};width:48px" onclick="ST.col='${c}'"></button>`).join('')}<label>${t('size')} <input type="range" min="2" max="24" value="${ST.sz}" oninput="ST.sz=+this.value"></label></div><div class="chips"><button onclick="undo()">↩ ${t('undo')}</button><button onclick="clr()">${t('clr')}</button><button class="pri" onclick="saveArt()">${t('save')}</button></div>`,
wish:()=>back()+`<h2>🌸 ${t('wish')}</h2><p class="card c3">${t('wnote')}</p><div class="chips">${[1,2,3,4,5].map(i=>`<button onclick="D.wishes.push({id:nid++,m:'wm${i}',ts:now()});alert(t('wsent'))">🌼 ${t('wm'+i)}</button>`).join('')}</div>`,
jour:()=>{const it=[...D.art.map((a,i)=>`<div class="card"><img src="${a}" width="200" alt="drawing"><br><button onclick="D.art.splice(${i},1);R()">${t('del')}</button></div>`),...(D.sdone?[`<div class="card c1">☁️ ${t('sty')}</div>`]:[]),...D.done.map(k=>`<div class="card c1">📖 ${AC[k][ST.lang==='ar'?2:3]}</div>`),...D.wishes.filter(w=>!w.demo).map(w=>`<div class="card c0">🌼 ${t(w.m)}</div>`)];
return back()+`<h2>🗺️ ${t('jour')}</h2>`+(it.length?`<div class="grid">${it.join('')}</div>`:`<p>${t('empty')}</p>`)},
people:()=>back()+`<h2>👨‍👩‍👧 ${t('n_p')}</h2><div class="card c0"><h3>${t('fam')}</h3><div class="chips"><span class="card">${ST.av} ${esc(ST.nick||'Lily')}</span>${D.fam.map(x=>`<span class="card c1">💛 ${esc(x)}</span>`).join('')}</div><input type="text" id="fn" maxlength="20" placeholder="${t('famph')}" aria-label="${t('famph')}"><p><button onclick="addFam()">${t('famadd')}</button></p></div><br><div class="card c2"><h3>💌 ${t('msgs')}</h3>${D.msgs.map(m=>`<p class="card">${esc(m[ST.lang]||m.m)}${m.demo?` <small class="demo">${t('demo')}</small>`:''}</p>`).join('')}</div><br><div class="card c3"><h3>${t('tt')}</h3><div class="chips">${[1,2,3,4,5].map(i=>`<span class="card">🌟 ${t('tt'+i)}</span>`).join('')}</div></div><br><div class="card c4"><h3>📸 ${t('album')}</h3>${D.art.length?D.art.map(a=>`<img src="${a}" width="120" alt="drawing"> `).join(''):t('empty')}</div>`,
care:()=>ST.cok?V.careMain():careGate(),
careMain:()=>`<h1>👪 ${t('care')}</h1><p class="demo">${t('demo')}</p><p>🔗 ${t('linkedN')}: <b>${D.nname}</b> <button onclick="ST.cok=0;go('home')">${t('careout')}</button></p><p class="card c3">${t('cn')}</p><div class="chips">${chip(D.cons.f,`D.cons.f=!D.cons.f;R()`,t('c1'))}${chip(D.cons.h,`D.cons.h=!D.cons.h;R()`,t('c2'))}${chip(D.cons.p,`D.cons.p=!D.cons.p;R()`,t('c3'))}</div>${D.cons.f?`<div class="card"><b>${t('n_f')}</b>: ${D.reports.filter(r=>r.k==='feel').length}</div>`:''}${D.cons.h?`<div class="card"><b>${t('n_h')}</b>: ${D.reports.filter(r=>r.k==='sym').length}</div>`:''}<h3>💌 ${t('msgs')}</h3><textarea id="cm" rows="3" maxlength="300" placeholder="${t('msgph')}" aria-label="${t('msgph')}"></textarea><p><button class="pri" onclick="addMsg()">${t('msgadd')}</button> <button onclick="go('home')">${t('home')}</button></p>`,
nurse:()=>ST.nok?nurseTabs():nurseGate(),
nurseOld:()=>{const rs=[...D.reports].reverse(),fl=rs.filter(flagged),n=rs.filter(r=>r.k==='feel').length;
const row=r=>`<div class="card ${flagged(r)?'flag':''}" style="margin:8px 0"><b>${r.k==='feel'?'💗 '+t('n_f'):'🩹 '+t('n_h')}</b> ${r.demo?`<span class="demo">${t('demo')}</span>`:''}<br>${desc(r)}<br><small>${r.ts==='DEMO'?'—':r.ts} · ${t('src')} · ${r.rev?'✅ '+t('rev'):'📥 '+t('st')}</small><br>${r.rev?'':`<button onclick="D.reports.find(x=>x.id==${r.id}).rev=1;R()">${t('mark')}</button>`}</div>`;
return`<h1>🩺 ${t('nd')}</h1><p class="demo">${t('demo')} — Lily (8) · ${t('roles')}: <button onclick="ST.role='child';go('home')">Child</button></p><h2>🔔 ${t('sig')}</h2><p><small>${t('sigN')}</small></p>${fl.map(row).join('')||'—'}<h2>${t('child')}</h2>${rs.map(row).join('')}<h2>${t('chk')}</h2>${E.f.map(x=>{const c=rs.filter(r=>r.k==='feel'&&r.v.includes(x)).length;return c?`<div>${t('f_'+x)} <span style="display:inline-block;height:14px;width:${c*40}px;background:var(--ac);border-radius:7px"></span> ${c}</div>`:''}).join('')}<p>${n} · ${t('miss')}</p><h2>🌼 ${t('n_w')}</h2>${D.wishes.map(w=>`<div class="card" style="margin:6px 0">${t(w.m)} <small>${w.demo?t('demo'):w.ts}</small></div>`).join('')}<h2>📝 ${t('notes')}</h2><textarea id="nn" rows="3" placeholder="${t('nph')}"></textarea><p><button class="pri" onclick="addN()">${t('addn')}</button></p>${D.notes.map(x=>`<div class="card c2" style="margin:6px 0">${esc(x.m)}<br><small>${x.ts}</small></div>`).join('')}<p class="demo">${t('phase2')}</p>`}};
function sendFeel(){D.reports.push({id:nid++,k:'feel',v:[...ST.f],w:[...ST.w],txt:ST.txt,ts:now()});ST.step=3;R()}
function sendSym(){D.reports.push({id:nid++,k:'sym',a:[...ST.a],pain:ST.pain,q:ST.q,s:[...ST.s],h:[...ST.h],ts:now()});ST.step=5;R()}
function newMem(){const e=['🐱','🐶','🐟','🐦','🐰','🦋'];G.c=[...e,...e].sort(()=>Math.random()-.5);G.o=[];G.m=[];G.lock=0}
function flip(i){if(G.lock||G.o.includes(i)||G.m.includes(i))return;G.o.push(i);if(G.o.length===2){if(G.c[G.o[0]]===G.c[G.o[1]]){G.m.push(...G.o);G.o=[]}else{G.lock=1;R();setTimeout(()=>{G.o=[];G.lock=0;R()},1000);return}}R()}
function nurseTabs(){const rs=[...D.reports].reverse(),fe=rs.filter(r=>r.k==='feel'),sy=rs.filter(r=>r.k==='sym'),fl=rs.filter(flagged),k=ST.nt||0,ts=r=>r.ts==='DEMO'?'—':r.ts;
const row=r=>`<div class="card ${flagged(r)?'flag':''}" style="margin:8px 0"><span class="demo">${t('child')}</span>${r.demo?` <span class="demo">${t('demo')}</span>`:''}<br>${desc(r)}<br><small>${ts(r)} · ${t('src')} · ${r.rev?'✅ '+t('rev'):'📥 '+t('st')}</small><br>${r.rev?'':`<button onclick="D.reports.find(x=>x.id==${r.id}).rev=1;R()">${t('mark')}</button>`}</div>`;
const bar=(c,w)=>`<span style="display:inline-block;height:14px;width:${w}px;background:var(--ac);border-radius:7px"></span> ${c}`;let b='';
if(k===0)b=`<p>${ST.av} <b>${esc(ST.nick||'Lily')}</b> · ${t('demo')}</p><div class="grid"><div class="card c0"><b>${fe.length}</b><br>${t('n_f')}</div><div class="card c1"><b>${sy.length}</b><br>${t('n_h')}</div><div class="card c3"><b>${D.reports.filter(r=>!r.rev).length}</b><br>${t('pend')}</div></div><h2>🔔 ${t('sig')}</h2><p><small>${t('sigN')}</small></p>${fl.map(row).join('')||'—'}`;
if(k===1)b=`${fe.map(row).join('')||'—'}<h3>${t('chk')}</h3>${E.f.map(x=>{const c=fe.filter(r=>r.v.includes(x)).length;return c?`<div>${t('f_'+x)} ${bar(c,c*40)}</div>`:''}).join('')}<p><small>${t('miss')}</small></p>`;
if(k===2){const pn=sy.filter(r=>typeof r.pain==='number');b=`${sy.map(row).join('')||'—'}<h3>${t('pain')}</h3>${pn.map(r=>`<div>${bar(r.pain+'/10',r.pain*20)} <small>${ts(r)}</small></div>`).join('')}<p><small>${t('miss')}</small></p>`}
if(k===3)b=`<div class="card"><span class="demo">${t('child')}</span><p>${t('av')}: ${ST.av}<br>${t('th')}: ${t('th_'+ST.theme)}<br>${t('pf1')}: ${t('pf1v')}</p></div>`;
if(k===4)b=D.wishes.map(w=>`<div class="card" style="margin:8px 0">🌼 ${t(w.m)}<br><small>${w.demo?t('demo'):w.ts} · ${w.rev?'✅ '+t('rev'):'📥 '+t('st')}</small> ${w.rev?'':`<button onclick="D.wishes.find(x=>x.id==${w.id}).rev=1;R()">${t('mark')}</button>`}</div>`).join('')+`<p class="demo">${t('wnote')}</p>`;
if(k===5)b=`<div class="card"><b>${t('msgs')}</b> (${D.msgs.length})${D.msgs.map(m=>`<p>💌 ${esc(m[ST.lang]||m.m)}</p>`).join('')}<b>${t('fam')}</b>: ${D.fam.map(esc).join('، ')||'—'}<hr><small>${t('c1')}: ${D.cons.f?'✔':'✖'}<br>${t('c2')}: ${D.cons.h?'✔':'✖'}<br>${t('c3')}: ${D.cons.p?'✔':'✖'}</small></div>`;
if(k===7)b=`<p class="demo">${t('fcn')}</p><p>${t('nurseOf')}: <b dir="ltr">${D.ncode}</b></p><button class="pri" onclick="genCode()">${t('fcgen')}</button>${D.codes.map(c=>`<div class="card" style="margin:6px 0"><b dir="ltr">${c.code}</b> · ${c.used?'✅ '+t('fcused'):'🟢 '+t('fcact')} <small>${c.ts}</small></div>`).join('')}`;
if(k===6)b=`<p class="demo">${t('nnote')}</p><textarea id="nn" rows="3" placeholder="${t('nph')}" aria-label="${t('notes')}"></textarea><input type="text" id="nf" placeholder="${t('fup')}" aria-label="${t('fup')}" style="margin-top:8px"><p><button class="pri" onclick="addN2()">${t('addn')}</button></p>${D.notes.map(x=>`<div class="card c2" style="margin:6px 0"><b>🩺 ${t('prof')}</b><br>${esc(x.m)}${x.f?`<br><b>${t('fup')}:</b> ${esc(x.f)}`:''}<br><small>${x.ts}</small></div>`).join('')}`;
return`<h1>🩺 ${t('nd')}</h1><p class="demo">${t('demo')} — Lily (8) · <button onclick="ST.role='child';ST.nok=0;go('home')">${t('home')}</button></p><div class="chips">${['ov','fe','sy','pf','ws','fm','nt','fc'].map((x,i)=>chip(k===i,`ST.nt=${i};R()`,t('tb_'+x))).join('')}</div>${b}<p class="demo">${t('phase2')}</p>`}
function addN2(){const v=$('#nn').value.trim();if(v){D.notes.push({m:v,f:$('#nf').value.trim(),ts:now()});R()}}
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=crypto.getRandomValues(new Uint8Array(10));let c=[...b].map(x=>A[x%A.length]).join('');D.codes.push({code:c.slice(0,5)+'-'+c.slice(5),used:0,ts:now()});R()}
function nurseGate(){return`<h1>🩺 ${t('nd')}</h1><p class="card c3">${t('ngate')}</p><input type="text" id="ncode" dir="ltr" maxlength="8" autocomplete="off" placeholder="N____" aria-label="${t('ncode')}"><p><button class="pri" onclick="nurseIn()">${t('fcgo')}</button> <button onclick="go('home')">${t('home')}</button></p>${ST.nerr?`<p><b>${t('cbad')}</b></p>`:''}<p class="demo">${t('ndemo')}: <b dir="ltr">${D.ncode}</b></p>`}
function nurseIn(){const v=$('#ncode').value.toUpperCase().trim();if(v===D.ncode){ST.nok=1;ST.nerr=0}else ST.nerr=1;R()}
function careGate(){return`<h1>👪 ${t('care')}</h1><p class="card c3">${t('cgate')}</p><input type="text" id="fcode" dir="ltr" maxlength="12" autocomplete="off" placeholder="XXXXX-XXXXX" aria-label="${t('fcode')}"><p><button class="pri" onclick="redeem()">${t('fcgo')}</button> <button onclick="go('home')">${t('home')}</button></p>${ST.cerr?`<p><b>${ST.catt>=5?t('clock'):t('cbad')}</b></p>`:''}<p class="demo">${t('cdemo')}</p>`}
function redeem(){if(ST.catt>=5){ST.cerr=1;return R()}const v=$('#fcode').value.toUpperCase().replace(/[^A-Z0-9]/g,''),c=D.codes.find(x=>!x.used&&x.code.replace('-','')===v);if(c){c.used=1;ST.cok=1;ST.cerr=0;ST.catt=0}else{ST.cerr=1;ST.catt=(ST.catt||0)+1}R()}
function saveCol(){D.art.push('data:image/svg+xml;utf8,'+encodeURIComponent(document.getElementById('col').outerHTML));go('jour')}
function pickM(j){if(j===G.r){G.r++;G.w=0}else G.w=1;R()}
function addFam(){const v=$('#fn').value.trim();if(v){D.fam.push(v);R()}}
function addMsg(){const v=$('#cm').value.trim();if(v){D.msgs.push({m:v});R()}}
function addN(){const v=$('#nn').value.trim();if(v){D.notes.push({m:v,ts:now()});R()}}
let cv,cx,dr=false;
function initCanvas(){cv=$('#cv');cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,520,360);hist=[cx.getImageData(0,0,520,360)];cx.lineCap='round';cx.lineJoin='round';
const p=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*520/r.width,(e.clientY-r.top)*360/r.height]};
cv.onpointerdown=e=>{dr=true;cx.strokeStyle=ST.col;cx.lineWidth=ST.sz;cx.beginPath();const[x,y]=p(e);cx.moveTo(x,y);cx.lineTo(x+.1,y);cx.stroke()};
cv.onpointermove=e=>{if(!dr)return;const[x,y]=p(e);cx.lineTo(x,y);cx.stroke()};
cv.onpointerup=cv.onpointerleave=()=>{if(dr){dr=false;hist.push(cx.getImageData(0,0,520,360))}}}
function undo(){if(hist.length>1){hist.pop();cx.putImageData(hist[hist.length-1],0,0)}}
function clr(){cx.fillStyle='#fff';cx.fillRect(0,0,520,360);hist.push(cx.getImageData(0,0,520,360))}
function saveArt(){D.art.push(cv.toDataURL());go('jour')}
R();
</script></body></html>
